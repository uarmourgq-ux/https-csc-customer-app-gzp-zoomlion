<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin panel</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#f6f7f5;color:#1a1a1a}
  .shell{max-width:840px;margin:0 auto;padding:32px 24px 80px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  .card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:22px;margin-bottom:24px}
  .card h2{font-size:15px;margin:0 0 16px}
  label{font-size:12.5px;color:rgba(0,0,0,.55);display:block;margin-bottom:6px}
  input[type=text]{width:100%;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:10px 12px;font-size:14px}
  .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:inline-block}
  .btn{border:none;color:#fff;font-size:14px;font-weight:600;padding:11px 22px;border-radius:22px;cursor:pointer}
  .row-head{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:10px;font-size:11.5px;color:rgba(0,0,0,.45);padding:0 4px 8px;border-bottom:1px solid rgba(0,0,0,.06)}
  .dev-row{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(0,0,0,.05)}
  .dev-row input{border:1px solid rgba(0,0,0,.1);border-radius:6px;padding:7px 10px;font-size:13px;width:100%}
  .del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#c14c4c;font-size:16px}
  .ghost-btn{border:1px solid #3fa66b;background:transparent;color:#2c8452;font-size:13px;font-weight:600;padding:7px 14px;border-radius:18px;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div style="font-size:22px;font-weight:700">Admin panel</div>
      <div style="font-size:13px;color:rgba(0,0,0,.5);margin-top:4px">Brend va qurilma ma'lumotlarini boshqarish</div>
    </div>
    <button class="btn" id="saveBtn" style="background:#3fa66b">Saqlash</button>
  </div>

  <div class="card">
    <h2>Brend</h2>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <label>Kompaniya nomi</label>
        <input type="text" id="brandName">
      </div>
      <div>
        <label>Asosiy rang</label>
        <div id="swatches" style="display:flex;gap:8px"></div>
      </div>
    </div>
    <div style="margin-top:18px">
      <label>Kompaniya logotipi</label>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="width:64px;height:64px;border-radius:12px;border:1px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f6f7f8">
          <img id="logoPreview" style="max-width:100%;max-height:100%;display:none">
        </div>
        <input type="file" id="logoFile" accept="image/*">
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h2 style="margin:0">Shtrix kod / seriya raqamlari</h2>
      <button class="ghost-btn" id="addDevice">+ Qo'shish</button>
    </div>
    <div class="row-head"><div>#</div><div>Shtrix kod</div><div>Seriya raqami</div><div></div></div>
    <div id="devicesWrap"></div>
  </div>

  <p style="font-size:12px;color:rgba(0,0,0,.45);margin-top:16px;line-height:1.6">Bu ro'yxat mobil ilova skaneridan foydalaniladi. O'zgarishlar "Saqlash" bosilganda serverga yoziladi.</p>
</div>
<script>
const SWATCHES = ['#3fa66b','#3f7fd6','#d65f3f','#a13fc9','#8a9186'];
let cfg = { brandName:'', primaryColor:SWATCHES[0], logoFile:null, devices:[] };

async function load(){
  const r = await fetch('/api/config'); cfg = await r.json();
  document.getElementById('brandName').value = cfg.brandName || '';
  renderSwatches();
  renderDevices();
  if (cfg.logoFile) {
    const img = document.getElementById('logoPreview');
    img.src = '/uploads/' + encodeURIComponent(cfg.logoFile);
    img.style.display = 'block';
  }
}
function renderSwatches(){
  const wrap = document.getElementById('swatches'); wrap.innerHTML = '';
  SWATCHES.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'swatch'; s.style.background = c;
    s.style.borderColor = c === cfg.primaryColor ? '#1a1a1a' : 'transparent';
    s.onclick = ()=>{ cfg.primaryColor = c; renderSwatches(); };
    wrap.appendChild(s);
  });
}
function renderDevices(){
  const wrap = document.getElementById('devicesWrap'); wrap.innerHTML = '';
  cfg.devices.forEach((d,i)=>{
    const row = document.createElement('div'); row.className = 'dev-row';
    row.innerHTML = `<div style="font-size:13px;color:rgba(0,0,0,.4)">${i+1}</div>
      <input type="text" value="${d.barcode||''}" data-k="barcode" data-i="${i}">
      <input type="text" value="${d.serial||''}" data-k="serial" data-i="${i}">
      <div class="del" data-del="${i}">×</div>`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input').forEach(inp=>inp.addEventListener('input', e=>{
    cfg.devices[+e.target.dataset.i][e.target.dataset.k] = e.target.value;
  }));
  wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', e=>{
    cfg.devices.splice(+e.target.dataset.del, 1); renderDevices();
  }));
}
document.getElementById('addDevice').onclick = ()=>{ cfg.devices.push({barcode:'',serial:''}); renderDevices(); };
document.getElementById('brandName').oninput = e=> cfg.brandName = e.target.value;
document.getElementById('logoFile').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const fd = new FormData(); fd.append('logo', file);
  const r = await fetch('/api/config/logo', {method:'POST', body:fd});
  cfg = await r.json();
  const img = document.getElementById('logoPreview');
  img.src = '/uploads/' + encodeURIComponent(cfg.logoFile) + '?t=' + Date.now();
  img.style.display = 'block';
};
document.getElementById('saveBtn').onclick = async ()=>{
  await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    brandName: cfg.brandName, primaryColor: cfg.primaryColor, devices: cfg.devices
  })});
  const btn = document.getElementById('saveBtn');
  const old = btn.textContent; btn.textContent = 'Saqlandi ✓';
  setTimeout(()=> btn.textContent = old, 1600);
};
load();
</script>
</body>
</html>
